<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t">
  <title id="t">Line drawing of a road bike</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.3" fill="#11161C" fill-opacity=".09"/>
    </pattern>
  </defs>

  <rect width="1200" height="500" fill="#ECEFF2"/>
  <rect width="1200" height="500" fill="url(#dots)"/>

  <!-- bike, scaled up and centered -->
  <g transform="translate(93 -192) scale(1.3)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <line x1="80" y1="476" x2="700" y2="476" stroke="#11161C" stroke-opacity=".18" stroke-width="2"/>

    <!-- wheels -->
    <g stroke="#11161C" stroke-opacity=".55" stroke-width="5">
      <circle cx="220" cy="380" r="95"/>
      <circle cx="565" cy="380" r="95"/>
    </g>
    <g stroke="#11161C" stroke-opacity=".14" stroke-width="2">
      <circle cx="220" cy="380" r="78"/>
      <circle cx="565" cy="380" r="78"/>
    </g>
    <g fill="#11161C" fill-opacity=".55">
      <circle cx="220" cy="380" r="6"/>
      <circle cx="565" cy="380" r="6"/>
    </g>

    <!-- frame -->
    <g stroke="#11161C" stroke-width="7">
      <path d="M422 368 L472 220"/>
      <path d="M466 236 L292 240"/>
      <path d="M422 368 L282 290"/>
      <path d="M292 240 L280 296"/>
      <path d="M280 296 L220 380"/>
      <path d="M422 368 L565 380"/>
      <path d="M466 236 L565 380"/>
    </g>
    <g stroke="#11161C" stroke-width="6">
      <path d="M440 212 L512 212"/>
      <path d="M472 220 L476 212"/>
      <path d="M292 240 L272 212 L250 210"/>
      <path d="M250 210 C226 210 222 236 238 248"/>
    </g>

    <!-- crank and pedal -->
    <circle cx="422" cy="368" r="20" stroke="#11161C" stroke-width="5"/>
    <path d="M422 368 L428 438" stroke="#11161C" stroke-width="6"/>
    <path d="M410 440 L446 440" stroke="#11161C" stroke-width="6"/>
  </g>
</svg>
